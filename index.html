<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentinel · TALON</title>
<meta name="description" content="Sentinel command console with TALON, an AI copilot for wildfire response. Training exercise on real Encinal Canyon terrain.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161922'/%3E%3Cpath d='M11 22v-8.3a2.7 2.7 0 0 1 2.7-2.7H22M42 11h8.3a2.7 2.7 0 0 1 2.7 2.7V22M53 42v8.3a2.7 2.7 0 0 1-2.7 2.7H42M22 53h-8.3a2.7 2.7 0 0 1-2.7-2.7V42' fill='none' stroke='%23565D6E' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M32 14.7 46.7 44 32 37.3 17.3 44Z' fill='none' stroke='%239B8AFF' stroke-width='3.6' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='47.5' r='3.2' fill='%2300E5FF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./console.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="app" id="app">
  <div id="map" role="main" aria-label="Tactical map"></div>
  <div class="boot" id="boot" role="region" aria-label="Loading"><div><span id="bootMascot"></span><span id="bootText">LOADING ENCINAL CANYON…</span></div></div>
</div>
<noscript>Sentinel needs JavaScript.</noscript>
<script type="module">
  if (location.protocol === 'file:') {
    document.getElementById('bootText').textContent = 'RUN “npm run serve” AND OPEN http://127.0.0.1:8130/ (the console reads ./data over HTTP).';
  } else {
    import('./commandConsole.js').then((m) => m.mountConsole(document.getElementById('app'))).catch((e) => {
      document.getElementById('bootText').textContent = `COULD NOT START: ${e.message}`;
      throw e;
    });
  }
</script>
</body>
</html>
